services:

  # ── PgBouncer: pooler de conexiones ───────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_USER: ${AIVEN_USER}
      DB_PASSWORD: ${AIVEN_PASSWORD}
      DB_HOST: ${AIVEN_HOST}
      DB_PORT: ${AIVEN_PORT}
      DB_NAME: ${AIVEN_DB}
      POOL_MODE: session
      MAX_CLIENT_CONN: "50"
      DEFAULT_POOL_SIZE: "5"
      SERVER_TLS_SSLMODE: require
      AUTH_TYPE: plain
    ports:
      - "5432:5432"
    networks:
      - app-net

  # ── API FastAPI ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./Api-pipeline
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - pgbouncer
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DB_URL: postgresql+psycopg://${AIVEN_USER}:${AIVEN_PASSWORD}@pgbouncer:5432/${AIVEN_DB}
      DATA_BASE_DIR: /data
      RAW_DIR: /data/data/raw
      PROCESSED_DIR: /data/data/processed
      RESULTS_DIR: /data/data/results
      REPORTS_DIR: /data/outputs/reportes
      COLUMN_MAPPING_PATH: config/column_mappings.json
      AIRFLOW_API_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_USERNAME: ${AIRFLOW_USER:-airflow}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD}
      AIRFLOW_VERIFY_SSL: "false"
    volumes:
      - ./data:/data/data
      - ./outputs:/data/outputs
    ports:
      - "8000:8000"
    networks:
      - app-net

  # ── Frontend React (Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./front-example
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - app-net

  # ── Airflow: inicializacion (corre una vez y sale) ─────────────────────────
  airflow-init:
    image: apache/airflow:2.10.4-python3.12
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_USER:-airflow}" \
          --password "${AIRFLOW_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIVEN_USER}:${AIVEN_PASSWORD}@pgbouncer:5432/${AIVEN_DB}
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "1"
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "0"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    depends_on:
      - pgbouncer
    networks:
      - app-net

  # ── Airflow: webserver ─────────────────────────────────────────────────────
  airflow-webserver:
    image: apache/airflow:2.10.4-python3.12
    restart: unless-stopped
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-18080}:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIVEN_USER}:${AIVEN_PASSWORD}@pgbouncer:5432/${AIVEN_DB}
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "1"
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "0"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - app-net

  # ── Airflow: scheduler ─────────────────────────────────────────────────────
  airflow-scheduler:
    image: apache/airflow:2.10.4-python3.12
    restart: unless-stopped
    command: scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIVEN_USER}:${AIVEN_PASSWORD}@pgbouncer:5432/${AIVEN_DB}
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "1"
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "0"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
